
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member List | RAKSHITHA GYM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="navbar">
    <a class="logo" href="index.html">RAKSHITHA <span>GYM</span></a>
    <nav>
        <a href="index.html">Home</a>
        <div class="dropdown">
            <button class="dropbtn">Management ▾</button>
            <div class="dropdown-content">
                <a href="insert.html">Add Member</a>
                <a href="list.html">Member List</a>
                <a href="listone.html">Find Member</a>
                <a href="update.html">Update Member</a>
                <a href="delete.html">Delete Member</a>
            </div>
        </div>
    </nav>
</header>

<main class="page-background wide-background">
    <section class="table-card">
        <p class="gold-text">RAKSHITHA GYM DATABASE</p>
        <h1>ALL MEMBERS</h1>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Age</th>
                        <th>Plan</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="membersTable">
                    <tr><td colspan="10">Loading members...</td></tr>
                </tbody>
            </table>
        </div>

        <p id="listMessage" class="message"></p>
        <button class="btn" id="refreshMembers" type="button">REFRESH LIST</button>
    </section>
</main>

<footer class="footer">
    <h2>RAKSHITHA GYM</h2>
    <p>YOUR HEALTH, OUR PRIORITY</p>
</footer>

</body>
</html>
